# Servidor estático para la versión web de Ika Travel.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Flutter Web es una SPA: cualquier ruta debe devolver index.html, o al
    # recargar la página (F5) o entrar por un enlace directo saldría un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: así un despliegue nuevo se ve al instante
    # en vez de quedarse servido desde el navegador.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # El resto de archivos llevan hash en el nombre, se pueden cachear fuerte.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|json|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El service worker sí debe revalidarse siempre.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
