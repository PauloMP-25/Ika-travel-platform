# ==============================================================================
# Ika Travel - Backend en Dokploy (un solo servicio Compose)
# ==============================================================================
# Diferencias con docker-compose.prod.yml (despliegue manual con Caddy):
#   - Sin servicio caddy: Dokploy ya ocupa los puertos 80 y 443 del VPS.
#   - Sin .env.production: las variables se definen en el panel de Dokploy.
#   - Sin container_name: permite redespliegues sin choques de nombre.
#   - Solo la API ejecuta las migraciones (ver nota en worker/beat).
#
# En Dokploy: Compose Path = ika-backend/docker-compose.dokploy.yml
#             Dominio      = servicio "api", puerto 8000, HTTPS activado.
# ==============================================================================

# Variables comunes a api, worker y beat. Se declaran una sola vez y se
# inyectan con "<<: *env-backend". Los valores vienen del panel de Dokploy,
# asi que ningun secreto vive en el repositorio.
x-env-backend: &env-backend
  # --- Base de datos y cache (nombres de servicio de la red interna) ---
  URL_BASE_DATOS: postgresql+asyncpg://${POSTGRES_USER:-ika_admin}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en Dokploy}@db:5432/${POSTGRES_DB:-ika_travel}
  URL_REDIS: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

  # --- Seguridad: sin valor por defecto a proposito ---
  # security.py lee SECRET_KEY, JWT_ALGORITHM y ACCESS_TOKEN_EXPIRE_MINUTES.
  # Si SECRET_KEY falta, el codigo cae en la clave de desarrollo publicada en
  # el repositorio, asi que aqui se exige con ":?" y el deploy se detiene.
  SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en Dokploy (openssl rand -hex 32)}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  CLAVE_ADMIN: ${CLAVE_ADMIN:?define CLAVE_ADMIN en Dokploy}

  ORIGENES_CORS: ${ORIGENES_CORS:-*}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS-}

  # --- IA (Gemini) ---
  GEMINI_API_KEY: ${GEMINI_API_KEY-}
  GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.1-flash-lite}
  GEMINI_TIMEOUT_SEGUNDOS: ${GEMINI_TIMEOUT_SEGUNDOS:-15.0}
  GEMINI_TIMEOUT_RECOMENDACION_SEGUNDOS: ${GEMINI_TIMEOUT_RECOMENDACION_SEGUNDOS:-2.5}

  # --- Clima ---
  OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY-}
  WEATHERAPI_API_KEY: ${WEATHERAPI_API_KEY-}
  CLIMA_URL_BASE: ${CLIMA_URL_BASE:-https://api.open-meteo.com/v1/forecast}
  CLIMA_ZONA_HORARIA: ${CLIMA_ZONA_HORARIA:-America/Lima}
  CLIMA_VIGENCIA_HORAS: ${CLIMA_VIGENCIA_HORAS:-3}
  CLIMA_LATITUD_REGION: ${CLIMA_LATITUD_REGION:--14.0678}
  CLIMA_LONGITUD_REGION: ${CLIMA_LONGITUD_REGION:--75.7286}
  TIMEOUT_CLIMA_SEGUNDOS: ${TIMEOUT_CLIMA_SEGUNDOS:-10.0}
  TIMEOUT_PROVEEDOR_CLIMA_SEGUNDOS: ${TIMEOUT_PROVEEDOR_CLIMA_SEGUNDOS:-3.0}

  # --- Traduccion (vacio = usa GEMINI_MODELO) ---
  TRANSLATION_MODEL: ${TRANSLATION_MODEL-}
  TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-8.0}
  TRANSLATION_MAX_CHARS: ${TRANSLATION_MAX_CHARS:-500}
  TRANSLATION_CACHE_TTL_SECONDS: ${TRANSLATION_CACHE_TTL_SECONDS:-604800}
  TRANSLATION_FALLBACK_TTL_SECONDS: ${TRANSLATION_FALLBACK_TTL_SECONDS:-2592000}
  TRANSLATION_RATE_LIMIT_PER_MINUTE: ${TRANSLATION_RATE_LIMIT_PER_MINUTE:-30}

  # --- Rutas y DIRCETUR ---
  RUTAS_URL_BASE: ${RUTAS_URL_BASE:-https://routing.openstreetmap.de}
  RUTAS_TIMEOUT_SEGUNDOS: ${RUTAS_TIMEOUT_SEGUNDOS:-10.0}
  DIRCETUR_URL_PADRON: ${DIRCETUR_URL_PADRON-}

  # --- Declaradas en config.py (hoy ningun modulo las lee) ---
  UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
  SOS_NOTIFY_EMAILS: ${SOS_NOTIFY_EMAILS-}

  # --- Correo transaccional (RF-03: recuperar contrasena) ---
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USER: ${SMTP_USER-}
  SMTP_PASSWORD: ${SMTP_PASSWORD-}
  SMTP_FROM: ${SMTP_FROM-}
  SMTP_TIMEOUT_SEGUNDOS: ${SMTP_TIMEOUT_SEGUNDOS:-15.0}
  PASSWORD_RESET_URL_TEMPLATE: ${PASSWORD_RESET_URL_TEMPLATE:-ikatravel://reset-password?token={token}}
  PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
  PASSWORD_RESET_MAX_POR_IP: ${PASSWORD_RESET_MAX_POR_IP:-5}
  PASSWORD_RESET_VENTANA_IP_SEGUNDOS: ${PASSWORD_RESET_VENTANA_IP_SEGUNDOS:-900}
  PASSWORD_RESET_MAX_POR_CORREO: ${PASSWORD_RESET_MAX_POR_CORREO:-3}
  PASSWORD_RESET_VENTANA_CORREO_SEGUNDOS: ${PASSWORD_RESET_VENTANA_CORREO_SEGUNDOS:-3600}

# api, worker y beat comparten la misma imagen.
x-build-backend: &build-backend
  context: .
  dockerfile: Dockerfile

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ika_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-ika_travel}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ika_admin} -d ${POSTGRES_DB:-ika_travel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ika_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ika_net

  # Unico servicio que migra y siembra: conserva el ENTRYPOINT del Dockerfile
  # (entrypoint.sh -> espera a Postgres, alembic upgrade head, seed).
  api:
    build: *build-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *env-backend
    command: ["uvicorn", "src.main:aplicacion", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    expose:
      - "8000"
    healthcheck:
      # python:3.12-slim no incluye curl ni wget: la comprobacion usa Python.
      # GET / devuelve 200 (src/main.py: @aplicacion.get("/")).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - ika_net
      - dokploy-network

  # worker y beat anulan el ENTRYPOINT para NO repetir alembic ni el seed, y
  # esperan a que la API este sana: para entonces las migraciones ya acabaron.
  worker:
    build: *build-backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *env-backend
    entrypoint: []
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "-l", "info", "-c", "2"]
    networks:
      - ika_net

  beat:
    build: *build-backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *env-backend
    entrypoint: []
    command: ["celery", "-A", "celery_worker.celery_app", "beat", "-l", "info"]
    networks:
      - ika_net

networks:
  ika_net:
    driver: bridge
  # Red del proxy de Dokploy: permite publicar el dominio sin abrir puertos.
  dokploy-network:
    external: true

volumes:
  postgres_data_prod:
  redis_data_prod:
