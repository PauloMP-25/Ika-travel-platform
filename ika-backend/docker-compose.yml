version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ika_db
    restart: always
    environment:
      POSTGRES_USER: ika_user
      POSTGRES_PASSWORD: ika_password
      POSTGRES_DB: ika_travel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
